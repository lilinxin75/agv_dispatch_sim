<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCS 多车料箱搬运调度演示</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="canvas-wrap">
    <canvas id="cv-static"></canvas>
    <canvas id="cv-obstacle"></canvas>
    <canvas id="cv-dynamic"></canvas>
    <div id="hint">滚轮缩放 · 拖拽平移 · 点击车辆查看详情 / 点击空地添加障碍物</div>
  </div>

  <div id="toolbar">
    <button id="btn-pause">暂停</button>
    <button id="btn-trails" title="显示/隐藏小车移动轨迹尾迹（FR-032）">轨迹:开</button>
    <button id="btn-reset-view">复位视图</button>
    <button id="btn-reset-sim" title="重置仿真到初始布局">重置仿真</button>
    <span id="tick-label">tick 0</span>
  </div>

  <div id="side">
    <div class="panel" id="metrics-panel">
      <h3>运行指标</h3>
      <div class="stat-grid">
        <div class="stat"><span class="v" id="m-tasks">0</span><span class="k">完成任务</span></div>
        <div class="stat"><span class="v" id="m-waiting">0</span><span class="k">等待车辆</span></div>
        <div class="stat"><span class="v" id="m-stalled">0</span><span class="k">受阻车辆</span></div>
        <div class="stat"><span class="v" id="m-collision">0</span><span class="k">碰撞</span></div>
        <div class="stat"><span class="v" id="m-charging">0</span><span class="k">充电中</span></div>
        <div class="stat"><span class="v" id="m-chargeq">0</span><span class="k">充电排队</span></div>
        <div class="stat"><span class="v" id="m-battery">100</span><span class="k">平均电量%</span></div>
        <div class="stat"><span class="v" id="m-conn">—</span><span class="k">连接状态</span></div>
      </div>
      <div id="per-vehicle" class="small">各车完成数：—</div>
    </div>

    <div class="panel hidden" id="vehicle-panel">
      <h3>车辆详情 <button id="btn-close-vehicle" class="mini">×</button></h3>
      <div id="vehicle-info" class="small"></div>
    </div>

    <div class="panel" id="events-panel">
      <h3>事件</h3>
      <div id="event-feed" class="small"></div>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
