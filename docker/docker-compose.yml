name: ulti_rcs
services:
  brain_core:
    command: bash
    container_name: ${CONTAINER_NAME}
    environment:
      DISPLAY: ${DISPLAY}
      TERM: xterm-256color
      TZ: Asia/Hong_Kong
    hostname: ML
    image: ${DOCKER_IMAGE_PATH}
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m
    network_mode: host
    privileged: true
    shm_size: 2g
    stdin_open: true
    restart: always
    tty: true
    volumes:
      - /dev:/dev:rw
      - /etc/udev/rules.d:/etc/udev/rules.d:ro
      - /media:/media:rw
      - /etc/ssh:/etc/ssh:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/group:/etc/group:ro
      - /etc/passwd:/etc/passwd:ro
      - /etc/shadow:/etc/shadow:ro
      - /usr/bin/docker:/usr/bin/docker:rw
      - /run/docker.sock:/var/run/docker.sock:rw
      - /home/dev/.ssh:/home/dev/.ssh:rw
      - /home/dev/log/.data:/home/dev/.data:rw
      - /home/dev/workspace:/home/dev/workspace:rw
    working_dir: /home/dev
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]